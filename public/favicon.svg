<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Royal Midnight Navy Canvas Gradient -->
    <linearGradient id="tabBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f26"/>
      <stop offset="50%" stop-color="#0c1a3d"/>
      <stop offset="100%" stop-color="#040918"/>
    </linearGradient>

    <!-- Regal Luminous Gold Gradient -->
    <linearGradient id="tabGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0"/>
      <stop offset="35%" stop-color="#F5C042"/>
      <stop offset="70%" stop-color="#DF9F28"/>
      <stop offset="100%" stop-color="#A56E14"/>
    </linearGradient>

    <!-- Brilliant White-Gold Shimmer -->
    <linearGradient id="tabShimmer" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DF9F28"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5C042"/>
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Rounded Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#tabBg)"/>
  
  <!-- Outer Gold Contour Border -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#tabGold)" stroke-width="12" opacity="0.85"/>
  <rect x="36" y="36" width="440" height="440" rx="90" fill="none" stroke="url(#tabGold)" stroke-width="3" opacity="0.35"/>

  <!-- Subtle Radiant Background Core -->
  <circle cx="256" cy="240" r="140" fill="#DFC15D" opacity="0.08" filter="url(#glow)"/>

  <!-- Academic Graduation Mortarboard (Top Icon Element) -->
  <g transform="translate(256, 150)">
    <!-- Mortarboard Diamond Cap -->
    <polygon points="0,-64 120,-16 0,32 -120,-16" fill="url(#tabGold)" stroke="#FFF5C0" stroke-width="4"/>
    <!-- Skull Cap Below Mortarboard -->
    <path d="M -64,-2 C -64,36 64,36 64,-2 Z" fill="#0c1a3d" stroke="url(#tabGold)" stroke-width="5"/>
    <!-- Tassel String and Hanging Bead -->
    <path d="M 0,-16 C 50,-8 90,14 104,48" fill="none" stroke="#FFF5C0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="104" cy="54" r="7" fill="url(#tabGold)"/>
  </g>

  <!-- Prominent Central Golden 'Q' / Emblem Body -->
  <g transform="translate(256, 290)">
    <!-- Bold Elegant Oval Ring -->
    <ellipse cx="0" cy="-20" rx="92" ry="98" fill="none" stroke="url(#tabGold)" stroke-width="22"/>
    <!-- Inner Accent Ring -->
    <ellipse cx="0" cy="-20" rx="72" ry="78" fill="none" stroke="#FFF5C0" stroke-width="4" opacity="0.6"/>

    <!-- Dynamic Bold Swooping Tail of the Q -->
    <path d="M 28,26 C 60,32 102,68 136,88 C 114,88 82,78 46,62 Z" fill="url(#tabGold)" stroke="#FFF5C0" stroke-width="3"/>
    
    <!-- Central Mathematical Sigma / Checkmark Emblem -->
    <path d="M -34,-48 L 34,-48 L -6,-16 L 34,16 L -34,16" fill="none" stroke="url(#tabShimmer)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bold, Crisp "MCQ" Acronym Banner at Bottom for immediate recognition -->
  <g transform="translate(256, 458)">
    <rect x="-140" y="-36" width="280" height="42" rx="12" fill="#040918" stroke="url(#tabGold)" stroke-width="3" opacity="0.95"/>
    <text x="0" y="-7" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="6" fill="url(#tabGold)">MCQ HUB</text>
  </g>
</svg>
